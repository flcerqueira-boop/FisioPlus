<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MQ - Questionários | Fisio+ by OrtoFlix</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWKJWZLST0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NWKJWZLST0');
    </script>

    <meta name="theme-color" content="#0B1E3D"/>

    <!-- Verificação de autenticação Fisio+ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const app = initializeApp({
        apiKey: "AIzaSyDe_7GdbVfwcVeG19lj_4ZkL0zKZaLP68o",
        authDomain: "fisioplus-cd92b.firebaseapp.com",
        projectId: "fisioplus-cd92b",
      });

      const auth = getAuth(app);
      const db = getFirestore(app);

      // Mostrar loading
      document.getElementById('root').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1E3D;">
          <div style="text-align:center;color:white;font-family:sans-serif;">
            <div style="font-size:32px;margin-bottom:12px;">📋</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.6);">Carregando...</div>
          </div>
        </div>`;

      async function verificarAcesso(user) {
        if (!user) {
          window.location.href = "https://fisiomais.ortoflix.com";
          return;
        }
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (!userDoc.exists() || userDoc.data().status !== "approved") {
            window.location.href = "https://fisiomais.ortoflix.com";
            return;
          }
          // Aprovado — carrega o app
          document.getElementById('root').innerHTML = '';
          const script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = true;
          script.src = '/mq/app.js';
          document.head.appendChild(script);
        } catch(e) {
          window.location.href = "https://fisiomais.ortoflix.com";
        }
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          verificarAcesso(user);
        } else {
          window.location.href = "https://fisiomais.ortoflix.com";
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
