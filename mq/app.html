<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MQ - Questionários | Fisio+ by OrtoFlix</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWKJWZLST0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NWKJWZLST0');
    </script>

    <meta name="theme-color" content="#0B1E3D"/>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // App do Fisio+ — checa quem está logado (nome customizado, não é o app padrão)
      const app = initializeApp({
        apiKey: "AIzaSyDe_7GdbVfwcVeG19lj_4ZkL0zKZaLP68o",
        authDomain: "fisioplus-cd92b.firebaseapp.com",
        projectId: "fisioplus-cd92b",
      }, "fisioplus-check");

      const auth = getAuth(app);
      const db = getFirestore(app);

      // App do FisioQ com o MESMO nome padrão ("[DEFAULT]") que o app.js dele usa.
      // Serve só pra ter uma sessão válida no Firestore do FisioQ (as regras de
      // segurança dele provavelmente exigem algum request.auth) — NÃO controla
      // mais acesso: quem entra ou não é decidido só pelo login do Fisio+.
      const appFQ = initializeApp({
        apiKey: "AIzaSyAfRmWEYBpw1vv6RFnjD8ne5X3PRgqFQfE",
        authDomain: "fisioq-b2c0a.firebaseapp.com",
        projectId: "fisioq-b2c0a",
        storageBucket: "fisioq-b2c0a.firebasestorage.app",
        messagingSenderId: "144943233360",
        appId: "1:144943233360:web:f500ded7fb0d9d7b9a9455",
      });
      const authFQ = getAuth(appFQ);

      function garantirSessaoAnonimaFisioQ() {
        return new Promise((resolve) => {
          if (authFQ.currentUser) { resolve(); return; }
          signInAnonymously(authFQ)
            .then(() => resolve())
            .catch((e) => {
              // Não bloqueia o acesso ao app — só pode afetar salvar/ler dados.
              console.warn("Sessão técnica do FisioQ falhou (dados podem não salvar):", e);
              resolve();
            });
        });
      }

      document.getElementById('root').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1E3D;">
          <div style="text-align:center;color:white;font-family:sans-serif;">
            <div style="font-size:32px;margin-bottom:12px;">📋</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.6);">Carregando...</div>
          </div>
        </div>`;

      function mostrarErro(titulo, detalhe) {
        document.getElementById('root').innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1E3D;padding:20px;">
            <div style="text-align:center;color:white;font-family:sans-serif;max-width:500px;">
              <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
              <div style="font-size:16px;font-weight:600;margin-bottom:8px;">${titulo}</div>
              <div style="font-size:12px;color:rgba(255,255,255,0.6);word-break:break-all;text-align:left;background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;margin-top:12px;">${detalhe}</div>
              <a href="https://fisiomais.ortoflix.com" style="display:inline-block;margin-top:20px;color:#F97316;font-size:13px;">← Voltar pro Fisio+</a>
            </div>
          </div>`;
      }

      async function carregarMQ(user) {
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (!userDoc.exists() || userDoc.data().status !== "approved") {
            mostrarErro("Usuário não aprovado no Fisio+", `uid: ${user.uid} | doc existe: ${userDoc.exists()} | status: ${userDoc.exists() ? userDoc.data().status : 'N/A'}`);
            return;
          }
        } catch (e) {
          mostrarErro("Erro ao checar aprovação no Fisio+", `${e.code || ''} ${e.message || e}`);
          return;
        }

        // Repassa a identidade do Fisio+ pro app.js usar — ele vai pular
        // toda a checagem própria de login quando enxergar isso.
        window.__fisioplusUser = {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || user.email,
        };

        await garantirSessaoAnonimaFisioQ();

        document.getElementById('root').innerHTML = '';
        const script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = true;
        script.src = '/mq/app.js';
        document.head.appendChild(script);
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          carregarMQ(user);
        } else {
          mostrarErro("Nenhum usuário logado no Fisio+", "onAuthStateChanged retornou null");
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
