<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MQ - Questionários | Fisio+ by OrtoFlix</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWKJWZLST0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NWKJWZLST0');
    </script>

    <meta name="theme-color" content="#0B1E3D"/>

    <!-- Verificação de autenticação Fisio+ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      import { initializeApp as initializeAppFQ } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth as getAuthFQ, onAuthStateChanged as onAuthStateChangedFQ, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const app = initializeApp({
        apiKey: "AIzaSyDe_7GdbVfwcVeG19lj_4ZkL0zKZaLP68o",
        authDomain: "fisioplus-cd92b.firebaseapp.com",
        projectId: "fisioplus-cd92b",
      });

      const auth = getAuth(app);
      const db = getFirestore(app);

      // App secundário: Firebase do FisioQ (fisioq-b2c0a), usado só pra logar
      // anonimamente antes de carregar o app.js e evitar a tela de login dele.
      const appFQ = initializeAppFQ({
        apiKey: "AIzaSyAfRmWEYBpw1vv6RFnjD8ne5X3PRgqFQfE",
        authDomain: "fisioq-b2c0a.firebaseapp.com",
        projectId: "fisioq-b2c0a",
        storageBucket: "fisioq-b2c0a.firebasestorage.app",
        messagingSenderId: "144943233360",
        appId: "1:144943233360:web:f500ded7fb0d9d7b9a9455",
      }, "fisioq-bridge");

      const authFQ = getAuthFQ(appFQ);

      function garantirSessaoFisioQ() {
        return new Promise((resolve) => {
          onAuthStateChangedFQ(authFQ, (userFQ) => {
            if (userFQ) {
              resolve();
            } else {
              signInAnonymously(authFQ).then(resolve).catch((e) => {
                console.warn("Login anônimo do FisioQ falhou:", e);
                resolve(); // segue mesmo assim, pra não travar tudo
              });
            }
          });
        });
      }

      // Mostrar loading
      document.getElementById('root').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1E3D;">
          <div style="text-align:center;color:white;font-family:sans-serif;">
            <div style="font-size:32px;margin-bottom:12px;">📋</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.6);">Carregando...</div>
          </div>
        </div>`;

      async function verificarAcesso(user) {
        if (!user) {
          window.location.href = "https://fisiomais.ortoflix.com";
          return;
        }
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (!userDoc.exists() || userDoc.data().status !== "approved") {
            window.location.href = "https://fisiomais.ortoflix.com";
            return;
          }
          // Aprovado — garante sessão no Firebase do FisioQ (anônima, sem tela)
          // antes de injetar o app.js, pra ele não pedir login de novo.
          await garantirSessaoFisioQ();
          document.getElementById('root').innerHTML = '';
          const script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = true;
          script.src = '/mq/app.js';
          document.head.appendChild(script);
        } catch(e) {
          window.location.href = "https://fisiomais.ortoflix.com";
        }
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          verificarAcesso(user);
        } else {
          window.location.href = "https://fisiomais.ortoflix.com";
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
