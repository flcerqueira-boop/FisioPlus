<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Painel Admin | Fisio+ by OrtoFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117; --surface: #161b22; --surface2: #1e2530;
        --border: #30363d; --accent: #f97316; --accent-hover: #ea6c0a;
        --accent-soft: rgba(249,115,22,0.12); --text: #e6edf3; --text-muted: #8b949e;
      }
      * { box-sizing: border-box; }
      body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; margin: 0; font-size: 15px; }
      .syne { font-family: 'Syne', sans-serif; }
      .btn { border: none; border-radius: 10px; padding: 10px 16px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-danger { background: rgba(248,81,73,0.15); color: #f85149; }
      .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
      .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
      .badge-approved { background: rgba(63,185,80,0.15); color: #3fb950; }
      .badge-pending { background: rgba(249,115,22,0.15); color: var(--accent); }
      .badge-rejected { background: rgba(248,81,73,0.15); color: #f85149; }
      .badge-admin { background: rgba(88,166,255,0.15); color: #58a6ff; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
      td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px 14px; font-size: 15px; width: 100%; }
      input:focus { outline: none; border-color: var(--accent); }
      .hidden { display: none !important; }
      .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- CARREGANDO -->
    <div id="loading-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
      <div class="spinner"></div>
    </div>

    <!-- BLOQUEADO POR SESSÃO -->
    <div id="no-admin-screen" class="hidden" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;">
      <div style="max-width:340px;">
        <div style="font-size:32px;margin-bottom:12px;">🔒</div>
        <div class="syne" style="font-weight:700;font-size:16px;margin-bottom:8px;">Acesso restrito</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">Faça login como administrador no Fisio+ e volte a esta página.</div>
        <a href="https://fisiomais.ortoflix.com" class="btn btn-primary" style="text-decoration:none;display:inline-block;">Ir para o Fisio+</a>
      </div>
    </div>

    <!-- PAINEL -->
    <div id="panel" class="hidden">
      <div style="position:sticky;top:0;background:rgba(13,17,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;z-index:10;">
        <div class="syne" style="font-weight:800;font-size:16px;">Painel Admin <span style="color:var(--accent);">Fisio+</span></div>
        <a href="https://fisiomais.ortoflix.com" style="color:var(--text-muted);font-size:12px;text-decoration:none;">← Hub</a>
      </div>

      <div style="max-width:900px;margin:0 auto;padding:20px;">

        <!-- Stats -->
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;">
          <div class="card"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Total</div><div id="stat-total" class="syne" style="font-size:28px;font-weight:800;margin-top:4px;">–</div></div>
          <div class="card"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Ativos</div><div id="stat-approved" class="syne" style="font-size:28px;font-weight:800;margin-top:4px;color:#3fb950;">–</div></div>
          <div class="card"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Pendentes</div><div id="stat-pending" class="syne" style="font-size:28px;font-weight:800;margin-top:4px;color:var(--accent);">–</div></div>
          <div class="card"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Rejeitados</div><div id="stat-rejected" class="syne" style="font-size:28px;font-weight:800;margin-top:4px;color:#f85149;">–</div></div>
        </div>

        <!-- Campanha Promocional -->
        <div class="card" style="margin-bottom:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div class="syne" style="font-weight:700;font-size:13px;">🎉 Campanha promocional (pop-up no hub)</div>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);cursor:pointer;">
              <input type="checkbox" id="promo-active" style="width:16px;height:16px;" />
              Ativa
            </label>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div>
              <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Título</label>
              <input id="promo-title-input" placeholder="Ex: 🎉 Você ganhou 50% de desconto!" />
            </div>
            <div>
              <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Mensagem</label>
              <textarea id="promo-message-input" rows="3" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px 14px;font-size:14px;font-family:inherit;resize:vertical;" placeholder="Descreva a promoção..."></textarea>
            </div>
            <div>
              <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Chamada de ação (CTA)</label>
              <input id="promo-cta-input" placeholder="Ex: 📸 Print esta tela e envie para @felipe_cerqueira no Instagram" />
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="salvarPromo(false)">💾 Salvar</button>
            <button class="btn btn-secondary" onclick="salvarPromo(true)">🔄 Salvar como nova campanha (mostrar pra todos de novo)</button>
          </div>
          <div id="promo-status" style="font-size:12px;color:var(--text-muted);margin-top:10px;"></div>
        </div>

        <!-- Analytics de cliques -->
        <div class="card" style="margin-bottom:20px;">
          <div class="syne" style="font-weight:700;font-size:13px;margin-bottom:14px;">Cliques nos cards do hub (últimos 30 dias)</div>
          <div id="clicks-analytics" style="display:flex;flex-direction:column;gap:10px;">
            <div class="spinner" style="margin:10px auto;"></div>
          </div>
        </div>

        <!-- Usuários -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div class="syne" style="font-weight:700;font-size:13px;">Usuários</div>
            <button class="btn btn-secondary" onclick="exportCSV()">⬇ Exportar CSV</button>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Ações</th></tr></thead>
              <tbody id="users-tbody"><tr><td colspan="4" style="text-align:center;padding:24px;"><div class="spinner" style="margin:0 auto;"></div></td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        getFirestore, collection, doc, getDoc, getDocs, updateDoc, setDoc,
        query, where, orderBy, serverTimestamp
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // MESMA config e MESMO nome (padrão) que o index.html principal —
      // essencial pra reconhecer a sessão já aberta lá.
      const firebaseConfig = {
        apiKey: "AIzaSyDe_7GdbVfwcVeG19lj_4ZkL0zKZaLP68o",
        authDomain: "fisioplus-cd92b.firebaseapp.com",
        projectId: "fisioplus-cd92b",
        storageBucket: "fisioplus-cd92b.firebasestorage.app",
        messagingSenderId: "137208430197",
        appId: "1:137208430197:web:6be479df7f7bc7fb31023c"
      };
      const ADMIN_EMAIL = "suporte@ortoflix.com";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let allUsers = [];

      // ─── VERIFICAÇÃO DE ADMIN (via sessão do Fisio+) ────────────────────
      // Acesso a esta página já é pelo link discreto no rodapé do hub —
      // a segurança real é: só entra quem estiver logado como admin.
      verificarAdmin();

      function verificarAdmin() {
        onAuthStateChanged(auth, async (user) => {
          document.getElementById('loading-screen').classList.add('hidden');
          if (!user) {
            document.getElementById('no-admin-screen').classList.remove('hidden');
            return;
          }
          let ehAdmin = user.email === ADMIN_EMAIL;
          if (!ehAdmin) {
            try {
              const userDoc = await getDoc(doc(db, "users", user.uid));
              ehAdmin = userDoc.exists() && userDoc.data().role === "admin";
            } catch (e) {}
          }
          if (ehAdmin) {
            document.getElementById('panel').classList.remove('hidden');
            carregarUsuarios();
            carregarAnalytics();
            carregarPromo();
          } else {
            document.getElementById('no-admin-screen').classList.remove('hidden');
          }
        });
      }

      // ─── USUÁRIOS ────────────────────────────────────────────────────────
      async function carregarUsuarios() {
        const tbody = document.getElementById('users-tbody');
        try {
          const snap = await getDocs(query(collection(db, "users"), orderBy("createdAt", "desc")));
          allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));

          const total = allUsers.length;
          const approved = allUsers.filter(u => u.status === "approved").length;
          const pending = allUsers.filter(u => u.status === "pending").length;
          const rejected = allUsers.filter(u => u.status === "rejected").length;
          document.getElementById('stat-total').textContent = total;
          document.getElementById('stat-approved').textContent = approved;
          document.getElementById('stat-pending').textContent = pending;
          document.getElementById('stat-rejected').textContent = rejected;

          if (allUsers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted);">Nenhum usuário.</td></tr>`;
            return;
          }

          tbody.innerHTML = allUsers.map(u => {
            const isAdmin = u.role === "admin";
            const statusBadge = isAdmin
              ? `<span class="badge badge-admin">Admin</span>`
              : u.status === "approved" ? `<span class="badge badge-approved">Ativo</span>`
              : u.status === "rejected" ? `<span class="badge badge-rejected">Rejeitado</span>`
              : `<span class="badge badge-pending">Pendente</span>`;
            const actions = isAdmin
              ? `<button class="btn btn-secondary" style="padding:6px 10px;font-size:11px;" onclick="demoteAdmin('${u.id}')">Remover admin</button>`
              : u.status === "pending"
              ? `<div style="display:flex;gap:6px;">
                  <button class="btn btn-primary" style="padding:6px 10px;font-size:11px;" onclick="approveUser('${u.id}')">Aprovar</button>
                  <button class="btn btn-danger" style="padding:6px 10px;font-size:11px;" onclick="rejectUser('${u.id}')">Rejeitar</button>
                 </div>`
              : u.status === "rejected"
                ? `<button class="btn btn-secondary" style="padding:6px 10px;font-size:11px;" onclick="approveUser('${u.id}')">Aprovar assim mesmo</button>`
                : `<div style="display:flex;gap:6px;">
                    <button class="btn btn-danger" style="padding:6px 10px;font-size:11px;" onclick="revokeUser('${u.id}')">Revogar</button>
                    <button class="btn btn-secondary" style="padding:6px 10px;font-size:11px;" onclick="promoteAdmin('${u.id}')">⭐ Tornar admin</button>
                   </div>`;
            return `<tr>
              <td><strong>${u.name || "—"}</strong></td>
              <td style="color:var(--text-muted);">${u.email || "—"}</td>
              <td>${statusBadge}</td>
              <td>${actions}</td>
            </tr>`;
          }).join("");
        } catch (e) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:#f85149;">Erro ao carregar: ${e.message}</td></tr>`;
        }
      }

      window.approveUser = async (uid) => {
        await updateDoc(doc(db, "users", uid), { status: "approved" });
        carregarUsuarios();
      };
      window.rejectUser = async (uid) => {
        if (!confirm("Rejeitar este cadastro?")) return;
        await updateDoc(doc(db, "users", uid), { status: "rejected" });
        carregarUsuarios();
      };
      window.revokeUser = async (uid) => {
        if (!confirm("Revogar o acesso deste usuário?")) return;
        await updateDoc(doc(db, "users", uid), { status: "pending" });
        carregarUsuarios();
      };
      window.promoteAdmin = async (uid) => {
        const u = allUsers.find(x => x.id === uid);
        if (!confirm(`Tornar ${u ? u.email : "este usuário"} administrador? Isso dá acesso total ao painel.`)) return;
        await updateDoc(doc(db, "users", uid), { role: "admin" });
        carregarUsuarios();
      };
      window.demoteAdmin = async (uid) => {
        const u = allUsers.find(x => x.id === uid);
        if (!confirm(`Remover privilégio de admin de ${u ? u.email : "este usuário"}?`)) return;
        await updateDoc(doc(db, "users", uid), { role: "professional" });
        carregarUsuarios();
      };

      // ─── CAMPANHA PROMOCIONAL ─────────────────────────────────────────────
      async function carregarPromo() {
        try {
          const snap = await getDoc(doc(db, "config", "promo"));
          if (snap.exists()) {
            const d = snap.data();
            document.getElementById('promo-active').checked = !!d.active;
            document.getElementById('promo-title-input').value = d.title || "";
            document.getElementById('promo-message-input').value = d.message || "";
            document.getElementById('promo-cta-input').value = d.cta || "";
          }
        } catch (e) {
          document.getElementById('promo-status').textContent = `Erro ao carregar: ${e.message}`;
        }
      }

      window.salvarPromo = async (novaCampanha) => {
        const statusEl = document.getElementById('promo-status');
        const data = {
          active: document.getElementById('promo-active').checked,
          title: document.getElementById('promo-title-input').value.trim(),
          message: document.getElementById('promo-message-input').value.trim(),
          cta: document.getElementById('promo-cta-input').value.trim(),
          updatedAt: serverTimestamp(),
        };
        if (novaCampanha) {
          data.version = Date.now();
        }
        try {
          await setDoc(doc(db, "config", "promo"), data, { merge: true });
          statusEl.style.color = "#3fb950";
          statusEl.textContent = novaCampanha
            ? "✅ Salvo como nova campanha — vai aparecer de novo pra todo mundo."
            : "✅ Salvo.";
          setTimeout(() => { statusEl.textContent = ""; }, 4000);
        } catch (e) {
          statusEl.style.color = "#f85149";
          statusEl.textContent = `Erro ao salvar: ${e.message}`;
        }
      };

      // ─── ANALYTICS DE CLIQUES ────────────────────────────────────────────
      async function carregarAnalytics() {
        const el = document.getElementById('clicks-analytics');
        try {
          const trintaDiasAtras = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
          const snap = await getDocs(query(
            collection(db, "card_clicks"),
            where("createdAt", ">=", trintaDiasAtras)
          ));
          const counts = {};
          snap.docs.forEach(d => {
            const card = d.data().card || "?";
            counts[card] = (counts[card] || 0) + 1;
          });
          const labels = { ME: "Exercícios (ME)", MQ: "Questionários (MQ)", CBDF: "CBDF", ORTOFLIX: "OrtoFlix" };
          const max = Math.max(1, ...Object.values(counts));
          const ordem = ["ME", "MQ", "CBDF", "ORTOFLIX"];
          el.innerHTML = ordem.map(card => {
            const n = counts[card] || 0;
            const pct = Math.round((n / max) * 100);
            return `<div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
                <span style="color:var(--text-muted);">${labels[card]}</span>
                <strong>${n}</strong>
              </div>
              <div style="background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;">
                <div style="background:var(--accent);height:100%;width:${pct}%;"></div>
              </div>
            </div>`;
          }).join("");
          if (snap.empty) {
            el.innerHTML += `<div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;">Sem cliques registrados ainda nos últimos 30 dias.</div>`;
          }
        } catch (e) {
          el.innerHTML = `<div style="color:#f85149;font-size:12px;">Erro ao carregar analytics: ${e.message}</div>`;
        }
      }

      // ─── EXPORTAR CSV ────────────────────────────────────────────────────
      window.exportCSV = () => {
        const header = ["Nome", "E-mail", "Status", "CREFITO", "Criado em"];
        const rows = allUsers.map(u => [
          u.name || "",
          u.email || "",
          u.status || "",
          u.crefito || "",
          u.createdAt && u.createdAt.toDate ? u.createdAt.toDate().toLocaleDateString('pt-BR') : ""
        ]);
        const csv = [header, ...rows]
          .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
          .join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `usuarios-fisioplus-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };
    </script>
  </body>
</html>
