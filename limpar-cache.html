<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Limpar cache - Fisio+</title>
    <style>
      body { font-family: sans-serif; background: #0B1E3D; color: white; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .box { text-align: center; max-width: 340px; }
      button { background: #F97316; color: white; border: none; border-radius: 10px; padding: 14px 24px; font-size: 15px; font-weight: 600; margin-top: 20px; width: 100%; }
      #log { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.6); text-align: left; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="box">
      <div style="font-size:32px;margin-bottom:12px;">🧹</div>
      <div style="font-weight:700;font-size:16px;">Limpar cache do Fisio+</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-top:8px;">Remove o Service Worker e todos os caches guardados neste navegador.</div>
      <button onclick="limpar()">Limpar agora</button>
      <div id="log"></div>
    </div>
    <script>
      function log(msg) {
        document.getElementById('log').textContent += msg + "\n";
      }
      async function limpar() {
        log('Iniciando...');
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          log(`Service Workers encontrados: ${regs.length}`);
          for (const r of regs) {
            await r.unregister();
            log('→ Service Worker removido.');
          }
        } catch (e) {
          log('Erro ao remover Service Worker: ' + e.message);
        }
        try {
          const keys = await caches.keys();
          log(`Caches encontrados: ${keys.length}`);
          for (const k of keys) {
            await caches.delete(k);
            log(`→ Cache "${k}" apagado.`);
          }
        } catch (e) {
          log('Erro ao limpar caches: ' + e.message);
        }
        log('\nPronto! Fechando em 3 segundos...');
        setTimeout(() => {
          window.location.href = 'https://fisiomais.ortoflix.com/';
        }, 3000);
      }
    </script>
  </body>
</html>
